name: Exposure report
description: Report redacted scanner behavior without publishing sensitive scan data.
title: "[exposure report]: "
labels: ["exposure-report"]
body:
  - type: markdown
    attributes:
      value: |
        Share only the minimum redacted details needed to describe scanner behavior. Do not paste or attach raw/full scanner output, file paths, tokens, private keys, `.env` files, cloud credentials, proprietary logs, or malware samples. Use the private security-reporting path in SECURITY.md when the report concerns a vulnerability in this project.
  - type: textarea
    id: summary
    attributes:
      label: Redacted summary
      description: Describe the unexpected finding type, severity, and exit code without including paths or raw output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, package manager, and whether install scripts may have run.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Minimal reproduction notes
      description: Include only synthetic or fully redacted details needed to reproduce the scanner behavior.
    validations:
      required: false
